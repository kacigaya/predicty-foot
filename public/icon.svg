<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .text {
      font-family: Inter, system-ui, sans-serif;
      font-weight: 700;
      font-size: 84px;
      letter-spacing: -0.025em;
      fill: #262626;
    }
    .accent {
